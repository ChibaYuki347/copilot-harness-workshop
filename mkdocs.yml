site_name: Copilot Harness Workshop
site_url: https://chibayuki347.github.io/copilot-harness-workshop/
site_description: >-
  A practical guide to customizing GitHub Copilot — both the Copilot CLI and
  VS Code Copilot Chat — with Custom Instructions, Prompt Files, Skills, Hooks,
  MCP servers, and Custom Agents.
site_author: Yuki Chiba
repo_name: ChibaYuki347/copilot-harness-workshop
repo_url: https://github.com/ChibaYuki347/copilot-harness-workshop
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Yuki Chiba — MIT License

theme:
  name: material
  language: en
  icon:
    logo: material/robot-happy-outline
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ChibaYuki347/copilot-harness-workshop
  alternate:
    - name: English
      link: /copilot-harness-workshop/
      lang: en
    - name: 日本語
      link: /copilot-harness-workshop/ja/
      lang: ja

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      base_path:
        - .
        - docs
        - examples
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      lang: [en, ja]
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            Home: ホーム
            Getting Started: はじめに
            What is Copilot CLI?: Copilot CLI とは
            Installation: インストール
            Workshop prep: Workshop 事前準備
            Ask mode vs Agent mode: Ask モードと Agent モード
            Your first session: 最初のセッション
            "Try this repo as a live demo": "このレポを live demo として試す"
            Slash commands tour: スラッシュコマンド入門
            Customizations: カスタマイズ
            Overview: 概要
            Custom Instructions: カスタムインストラクション
            Prompt Files & Slash Commands: プロンプトファイルとスラッシュコマンド
            Skills: スキル
            Hooks: フック
            MCP Servers: MCP サーバー
            Custom Agents: カスタムエージェント
            "Mental model": メンタルモデル
            Safety & Governance: 安全性とガバナンス
            "Governance overview": ガバナンス概要
            Risk mental model: リスクの mental model
            Approval cheat sheet: Approval cheat sheet
            Blast-radius limiting: Blast-radius を絞る
            Auditing: 事後の監査
            MCP vetting: MCP サーバーの vetting
            Recipes: レシピ
            "Recipe: PR Review Skill": レシピ — PR レビュースキル
            "Recipe: GitHub MCP server": レシピ — GitHub MCP サーバー
            "Recipe: Microsoft Foundry Tools MCP": レシピ — Microsoft Foundry Tools MCP
            "Recipe: session-end secret scan": レシピ — セッション終了時のシークレットスキャン
            "Recipe: path-specific instructions": レシピ — パス指定インストラクション
            "Recipe: multi-agent workflow": レシピ — マルチエージェントワークフロー
            "Presenting the harness": "レシピ — ハーネスを社内で紹介する"
            Case Studies: ケーススタディ
            Solo developer: 個人開発者
            Team rollout: チーム導入
            Reference: リファレンス
            CLI commands: CLI コマンド
            Hook events: フックイベント
            File layout: ファイル配置
            "VS Code vs Copilot CLI": "VS Code と Copilot CLI"
            Glossary: 用語集
            Exercises: 演習
            How to use this track: このトラックの使い方
            "0 · 60-minute live tour": "0 · 60 分ライブツアー"
            "1 · Custom Instructions": "1 · カスタムインストラクション"
            "2 · Prompt Files": "2 · プロンプトファイル"
            "3 · Skills": "3 · スキル"
            "4 · MCP Servers": "4 · MCP サーバー"
            "5 · Custom Agents": "5 · カスタムエージェント"
            "6 · Hooks": "6 · フック"
            "Capstone: release-notes pipeline": キャップストーン — リリースノートパイプライン

